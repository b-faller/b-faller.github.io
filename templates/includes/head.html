<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>{{ title }} - {{ site_title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical_url }}">

<link rel="alternate" type="application/rss+xml" title="{{ site_title }} RSS" href="{{ site_base_url }}/feed.xml">
<link rel="alternate" type="application/atom+xml" title="{{ site_title }} Atom" href="{{ site_base_url }}/atom.xml">

<meta property="og:title" content="{{ title }}">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:site_name" content="{{ site_title }}">
<meta property="og:description" content="{{ description }}">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">

{{ schema_jsonld }}
{{ breadcrumb_jsonld }}

{% include "includes/stylesheets.html" %}
{% include "includes/scripts.html" %}
